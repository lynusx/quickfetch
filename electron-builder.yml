appId: com.lynusx.quickfetch
# userData 目录名由 package.json 的 productName 决定；这里只影响 exe、快捷方式与标题
productName: QuickFetch
copyright: Copyright © 2026 lynusx

directories:
  output: release
  buildResources: build

# electron-builder 打包时会单独下载一次目标平台的 Electron 二进制，
# 与 ensure-electron.cjs 的镜像保持一致，避免国内网络下直连 GitHub 超时。
# 设置 ELECTRON_BUILDER_BINARIES_MIRROR 环境变量可覆盖。
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

# 只打包构建产物，源码不进安装包。
# 渲染层依赖（含 xlsx）已由 Vite 打进 out/renderer；主进程只把
# electron-updater 留在 dependencies，electron-builder 会单独收集生产依赖并放进 asar。
# 因此这里不要手写 node_modules，否则会把开发依赖也带进包。
files:
  - out/**/*
  - package.json

asar: true

# 只保留简体中文语言包：Electron 默认带 55 个 locales/*.pak（约 49MB），
# 本应用只面向中文现场，其余语言一律剔除，缩小免安装包体积。
electronLanguages:
  - zh-CN

# 同时产出安装包与免安装 zip：
# - NSIS 安装版支持 electron-updater 自动更新；
# - zip 版给禁止安装外部应用的机台，只能手动替换。
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # Windows 优先用多尺寸 ico（16–256），比让 electron-builder 现场从 png 生成更可控
  icon: build/icon.ico
  artifactName: QuickFetch-${version}-win-x64.${ext}
  # 未签名方案：不推导 publisherName；electron-updater 6.8.11 在缺少
  # publisherName 时会跳过 Authenticode 校验，仍会校验 latest.yml 的 sha512。
  verifyUpdateCodeSignature: false

# 只用于生成 latest.yml 与 app-update.yml；实际上传由 release workflow 用 gh 完成，
# dist:win 固定带 --publish never。
publish:
  - provider: generic
    url: https://github.com/lynusx/quickfetch/releases/latest/download/

# 安装包配置
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 秒取
  deleteAppDataOnUninstall: false
