appId: com.lynusx.shx-tools
productName: SHX Tools
copyright: Copyright © 2026 lynusx

directories:
  output: release
  buildResources: build

# 只打包构建产物，源码不进安装包
files:
  - out/**/*
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: SHX-Tools-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SHX Tools
  deleteAppDataOnUninstall: false
