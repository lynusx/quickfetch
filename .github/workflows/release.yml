name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

# 同一个 tag 重复推送或重跑时排队执行，避免两个任务同时上传附件
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # check-release 需要 HEAD 与完整历史；tag 检出是 detached HEAD，脚本允许
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Verify tag
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"

          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag 与 package.json 的 version $version 不一致，应为 v$version"
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag 指向的提交不在 main 上，拒绝发版"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Verify logic
        run: pnpm verify

      - name: Build and package
        run: pnpm dist:win

      - name: Verify update artifacts
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          installer="release/QuickFetch-${version}-win-x64.exe"
          blockmap="${installer}.blockmap"
          metadata="release/latest.yml"
          portable="release/QuickFetch-${version}-win-x64.zip"
          appUpdate="release/win-unpacked/resources/app-update.yml"

          for file in "$installer" "$blockmap" "$metadata" "$portable" "$appUpdate"; do
            if [ ! -f "$file" ]; then
              echo "::error::缺少发版产物 $file"
              exit 1
            fi
          done

          if ! grep -q "version: ${version}" "$metadata"; then
            echo "::error::latest.yml 中的 version 与 package.json 不一致"
            exit 1
          fi

          if grep -q 'publisherName' "$appUpdate"; then
            echo "::error::未签名方案不应在 app-update.yml 写入 publisherName"
            exit 1
          fi

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          installer="release/QuickFetch-${version}-win-x64.exe"
          blockmap="${installer}.blockmap"
          metadata="release/latest.yml"
          portable="release/QuickFetch-${version}-win-x64.zip"
          assets=("$installer" "$blockmap" "$metadata" "$portable")

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$tag" \
              --generate-notes
          fi

          # 幂等追加安装方式说明；重复运行不会重复写入
          body="$(gh release view "$tag" --json body -q .body)"
          if [[ "$body" != *"<!-- quickfetch-update-note -->"* ]]; then
            gh release edit "$tag" --notes "${body}

          <!-- quickfetch-update-note -->
          ## 安装方式

          - **安装版**（.exe）支持自动更新，推荐大多数现场使用。
          - **免安装版**（.zip）给禁止安装外部应用的机台：解压即用，但需要手动下载新 zip 替换，不会自动升级。
          - 设置与历史保存在 \`%APPDATA%\\QuickFetch\`，升级不会清空。"
          fi
